<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Amanati</title>
    <style>
      :root {
        --solid: #ffffff; --surface: #f4f4f6; --surface-hover: #ececef;
        --ink: #16181c; --grey: #74777d; --grey-light: #b0b3b8;
        --rule: rgba(22,24,28,.08); --red: #e5484d; --red-soft: rgba(229,72,77,.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --solid: #1a1b1e; --surface: #26272b; --surface-hover: #2e2f34;
          --ink: #f3f4f6; --grey: #9a9da3; --grey-light: #5c5f66;
          --rule: rgba(243,244,246,.08); --red: #ff5c61; --red-soft: rgba(255,92,97,.1);
        }
      }
      * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
      button, input, select { transition: all .15s ease; }
      body {
        width: 330px; margin: 0; background: var(--solid); color: var(--ink);
        font: 13px/1.5 -apple-system, "SF Pro Text", Inter, "Segoe UI", Roboto, "Noto Sans Georgian", sans-serif;
      }
      .wrap { padding: 16px; display: grid; gap: 14px; }
      .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: -0.02em; }
      .brand img { width: 24px; height: 24px; border-radius: 7px; }
      .section { display: grid; gap: 8px; }
      .section-title {
        font-size: 9.5px; font-weight: 600; color: var(--grey-light);
        text-transform: uppercase; letter-spacing: .08em;
      }
      .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .hint { font-size: 10.5px; color: var(--grey); line-height: 1.45; }
      .fx { font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 500; }
      select, input[type="number"], input[type="url"] {
        border: none; padding: 6px 10px; border-radius: 9px;
        background: var(--surface); color: var(--ink); font-size: 12.5px;
        font-variant-numeric: tabular-nums; font-weight: 500;
      }
      select:focus, input:focus { outline: 2px solid var(--red); outline-offset: 0; }
      input[type="number"] { width: 72px; }
      input[type="url"] { width: 100%; }
      button.primary {
        border: none; background: var(--red); color: #fff; font-weight: 600;
        padding: 11px 0; width: 100%; cursor: pointer; font-size: 13px;
        border-radius: 999px; letter-spacing: -0.01em;
      }
      button.primary:hover { filter: brightness(1.08); }
      button.ghost {
        border: none; background: var(--surface); color: var(--ink);
        padding: 5px 14px; cursor: pointer; font-size: 11.5px; font-weight: 600;
        border-radius: 999px;
      }
      button.ghost:hover { background: var(--surface-hover); color: var(--red); }
      label.check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
      input[type="checkbox"] { accent-color: var(--red); }
      .status { font-size: 11px; color: var(--red); min-height: 14px; font-weight: 500; }
      .tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 999px; padding: 3px; }
      .tabs button {
        flex: 1; border: none; background: transparent; color: var(--grey);
        padding: 7px 0; cursor: pointer; font-size: 12px; font-weight: 600;
        border-radius: 999px;
      }
      .tabs button.active { background: var(--solid); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
      .chips { display: flex; gap: 5px; flex-wrap: wrap; }
      .chips button {
        border: none; background: var(--surface); color: var(--grey);
        padding: 5px 12px; cursor: pointer; font-size: 11.5px; font-weight: 600;
        border-radius: 999px;
      }
      .chips button:hover { background: var(--surface-hover); }
      .chips button.active { background: var(--red-soft); color: var(--red); }
      .field { display: grid; grid-template-columns: 88px 1fr 26px; gap: 6px; align-items: center; }
      .field .lbl {
        font-size: 8.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
        color: var(--grey-light); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .field input {
        width: 100%; border: none; border-radius: 8px;
        padding: 5px 9px; background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 500;
      }
      .field input:focus { outline: 2px solid var(--red); }
      .copybtn {
        border: none; background: transparent; cursor: pointer; font-size: 13px;
        color: var(--grey-light); padding: 3px; border-radius: 7px;
      }
      .copybtn:hover { color: var(--red); background: var(--red-soft); }
      a.sitelink {
        color: var(--grey); font-size: 11px; text-decoration: none; font-weight: 600;
      }
      a.sitelink:hover { color: var(--red); }
      .divider { border-top: 1px solid var(--rule); margin: 2px 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
